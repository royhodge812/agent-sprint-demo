<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hotel Brendle Lobby Loop — Robstown, Texas</title>
<style>
:root{--bg:#0b0b0d;--ink:#f2ede3;--muted:#b9b2a4;--gold:#c9a227}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#slide{height:100vh;display:flex;flex-direction:column;justify-content:center;padding:6vw 8vw 70px}
.kicker{color:var(--gold);text-transform:uppercase;letter-spacing:.22em;font-size:clamp(12px,1.6vw,18px);font-family:Arial,Helvetica,sans-serif;font-weight:700}
h1{font-size:clamp(34px,6vw,84px);line-height:1.05;margin:14px 0 18px;max-width:1100px}
.body{font-size:clamp(17px,2.2vw,26px);line-height:1.5;max-width:1000px}
.body p{margin-bottom:12px}
ul{list-style:none;margin-top:8px;max-width:1050px}
li{font-size:clamp(16px,2vw,24px);line-height:1.45;margin-bottom:14px;padding-left:26px;position:relative}
li b{color:var(--gold)}
li::before{content:"\2014";position:absolute;left:0;color:var(--gold)}
.note{color:var(--muted);font-style:italic}
.foot{margin-top:22px;color:var(--muted);font-size:clamp(14px,1.7vw,20px);font-style:italic}
#bar{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 22px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:var(--muted);background:linear-gradient(transparent,rgba(0,0,0,.55))}
#bar a{color:var(--gold);text-decoration:none}
#dots{display:flex;gap:8px}
#dots span{width:9px;height:9px;border-radius:50%;background:#3a3a40}
#dots span.on{background:var(--gold)}
#err{padding:40px;font-family:Arial,sans-serif}
</style>
</head>
<body>
<div id="slide"><div class="kicker" id="kicker"></div><h1 id="title"></h1><div class="body" id="body"></div><div class="foot" id="foot"></div></div>
<div id="bar"><span>Hotel Brendle &middot; Robstown, Texas</span><span id="dots"></span><span><a href="board.html">Sprint board &mdash; watch the agents build this loop</a> &middot; <span id="clock"></span></span></div>
<script>
var slides=[], i=0;
function render(){
  var s=slides[i]; if(!s) return;
  document.getElementById('kicker').textContent=s.kicker||'';
  document.getElementById('title').textContent=s.title||'';
  var b=document.getElementById('body'); b.innerHTML='';
  if(s.body){ var p=document.createElement('p'); p.textContent=s.body; b.appendChild(p); }
  if(s.bullets){ var ul=document.createElement('ul');
    s.bullets.forEach(function(x){ var li=document.createElement('li');
      if(x.lead){ var bb=document.createElement('b'); bb.textContent=x.lead; li.appendChild(bb); li.appendChild(document.createTextNode(' \2014 ' + x.text)); }
      else li.textContent=x.text||x;
      ul.appendChild(li); });
    b.appendChild(ul); }
  if(s.note){ var np=document.createElement('p'); np.className='note'; np.textContent=s.note; b.appendChild(np); }
  document.getElementById('foot').textContent=s.foot||'';
  var d=document.getElementById('dots'); d.innerHTML='';
  slides.forEach(function(_,k){ var sp=document.createElement('span'); if(k===i) sp.className='on'; d.appendChild(sp); });
}
function next(){ i=(i+1)%slides.length; render(); }
fetch('slides.json').then(function(r){ return r.json(); }).then(function(j){
  slides=j.slides||[];
  if(slides.length){ render(); setInterval(next, 9000); }
  else document.getElementById('slide').innerHTML='<div id="err">The loop is empty right now — check back soon.</div>';
}).catch(function(){ document.getElementById('slide').innerHTML='<div id="err">Could not load the loop slides. Check back soon.</div>'; });
setInterval(function(){ var d=new Date(); document.getElementById('clock').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }, 1000);
</script>
</body>
</html>
